{% set version = "0.2.4" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-wheatmap
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/wheatmap_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/wheatmap/wheatmap_{{ version }}.tar.gz
  sha256: 1345b6138ab441bc54fdf0b550260ea9423d733e189680627e9c8fecb28dc51b

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/
  missing_dso_whitelist:
    - '*/R.dll'        # [win]
    - '*/Rblas.dll'    # [win]
    - '*/Rlapack.dll'  # [win]

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-rcolorbrewer
    - r-colorspace
    - r-gtable
    - r-pals
  run:
    - r-base
    - r-rcolorbrewer
    - r-colorspace
    - r-gtable
    - r-pals

test:
  commands:
    - $R -e "library('wheatmap')"           # [not win]
    - "\"%R%\" -e \"library('wheatmap')\""  # [win]

about:
  home: https://github.com/zwdzwd/wheatmap
  license: GPL-3.0-only
  summary: Builds complex plots, heatmaps in particular, using natural semantics. Bigger plots can be assembled using directives such as 'LeftOf', 'RightOf', 'TopOf', and 'Beneath' and more. Other features include clustering, dendrograms and integration with 'ggplot2' generated grid objects. This package is 
    particularly designed for bioinformaticians to assemble complex plots for publication.
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
